name: Test project
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v7
      # 2. Setup Java
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # 3. Build and test
      - name: Build with Maven
        run: mvn clean verify
